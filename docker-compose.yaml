services:
  postgres:
    image: postgres:16
    container_name: inventar-db
    restart: always
    environment:
      POSTGRES_USER: inventar
      POSTGRES_PASSWORD: inventar
      POSTGRES_DB: inventar-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_inventar:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventar -d inventar-db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: src/main
    container_name: inventar-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventar-db
      SPRING_DATASOURCE_USERNAME: inventar
      SPRING_DATASOURCE_PASSWORD: inventar
    ports:
      - "8082:8080"

volumes:
  postgres_data_inventar: